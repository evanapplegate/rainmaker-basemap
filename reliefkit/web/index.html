<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ReliefKit</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css" rel="stylesheet">
<style>
@font-face { font-family: "FG"; src: url("/fonts/TestFoundersGroteskText-Regular.otf"); }
@font-face { font-family: "FG"; font-weight: 600; src: url("/fonts/TestFoundersGroteskText-Semibold.otf"); }
@font-face { font-family: "FG"; font-weight: 500; src: url("/fonts/TestFoundersGroteskText-Medium.otf"); }
@font-face { font-family: "FlechaBI"; src: url("/fonts/FlechaTestS-BoldItalic.otf"); }
:root {
  --tan: #e8e0cc; --tan2: #ded4ba; --ink: #3f3a33; --accent: #b03a2e;
  --paper: #f3efe4;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; font-family: FG, Optima, "Segoe UI", sans-serif; color: var(--ink); }
#map { position: absolute; inset: 0 340px 0 0; }
#panel { position: absolute; top: 0; right: 0; bottom: 0; width: 340px;
  background: var(--tan); border-left: 2px solid var(--ink); padding: 18px 20px;
  overflow-y: auto; }
h1 { font-size: 21px; font-weight: 600; letter-spacing: .06em; margin: 0 0 2px; }
h1 em { font-family: FlechaBI, Georgia, serif; font-weight: 400; font-style: italic;
  letter-spacing: 0; text-transform: none; }
.sub { font-size: 12px; color: #6a645a; margin-bottom: 14px; }
h2 { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  border-bottom: 1px solid var(--ink); padding-bottom: 3px; margin: 18px 0 8px; }
label { display: block; font-size: 13px; margin: 4px 0; cursor: pointer; }
select, input[type=text] { width: 100%; font-family: inherit; font-size: 13px;
  padding: 5px 6px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
#extent { font-size: 12px; background: var(--paper); border: 1px solid var(--ink);
  padding: 7px 9px; min-height: 34px; }
button { width: 100%; font-family: inherit; font-size: 15px; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase; padding: 11px; margin-top: 14px;
  background: var(--ink); color: var(--tan); border: none; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
button.secondary { background: transparent; color: var(--ink); border: 1.5px solid var(--ink);
  padding: 8px; font-size: 12px; margin-top: 8px; }
#log { font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace; background: #2d2a25;
  color: #e6ddc8; padding: 10px; height: 220px; overflow-y: auto; white-space: pre-wrap;
  display: none; margin-top: 12px; }
.hint { font-size: 11.5px; color: #6a645a; margin-top: 6px; }
.chk2 { columns: 2; }
.badge { display: inline-block; background: var(--accent); color: #fff; font-size: 10px;
  padding: 1px 6px; border-radius: 8px; letter-spacing: .08em; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>RELIEF<em>Kit</em></h1>
  <div class="sub">shift-drag a box &rarr; pick a page &rarr; go. Output: linked-PSD Illustrator sheet.</div>

  <h2>Extent</h2>
  <div id="extent">shift-drag on the map</div>
  <button id="useview" class="secondary">Use current map view</button>

  <h2>Sheet</h2>
  <div class="row">
    <select id="page">
      <option value="letter-landscape">Letter landscape</option>
      <option value="letter-portrait">Letter portrait</option>
      <option value="tabloid-landscape">Tabloid landscape</option>
      <option value="tabloid-portrait">Tabloid portrait</option>
      <option value="slide-16x9">Slide 16:9</option>
      <option value="square">Square</option>
    </select>
  </div>
  <div class="row" style="margin-top:8px">
    <input type="text" id="title" placeholder="Sheet title (optional)">
  </div>

  <h2>Terrain</h2>
  <div class="row">
    <select id="dem">
      <option value="3dep10">USGS 3DEP 10 m (US)</option>
      <option value="cop30">Copernicus 30 m (global)</option>
      <option value="cop90">Copernicus 90 m (light)</option>
    </select>
  </div>
  <div class="row" style="margin-top:8px">
    <select id="contour">
      <option value="5">Contours 5 m</option>
      <option value="10">Contours 10 m</option>
      <option value="20" selected>Contours 20 m</option>
      <option value="40">Contours 40 m</option>
      <option value="100">Contours 100 m</option>
    </select>
    <select id="texture">
      <option value="high">Relief: high texture</option>
      <option value="low" selected>Relief: low texture</option>
    </select>
  </div>
  <div class="hint">Lighting is the classic NW 315&deg;/45&deg; in both engines.</div>

  <h2>Layers</h2>
  <div class="chk2" id="layers">
    <label><input type="checkbox" data-k="relief_blender" checked> Relief (Blender)</label>
    <label><input type="checkbox" data-k="relief_gdal" checked disabled> Relief (GDAL)</label>
    <label><input type="checkbox" data-k="landcover" checked> Landcover tint</label>
    <label><input type="checkbox" data-k="contours" checked> Contours + labels</label>
    <label><input type="checkbox" data-k="water" checked> Water</label>
    <label><input type="checkbox" data-k="roads" checked> Roads</label>
    <label><input type="checkbox" data-k="shields" checked> Shields</label>
    <label><input type="checkbox" data-k="ownership" checked> Land ownership</label>
    <label><input type="checkbox" data-k="labels" checked> Labels</label>
    <label><input type="checkbox" data-k="locator" checked> Locator</label>
  </div>

  <button id="go" disabled>Go</button>
  <button id="open" class="secondary" style="display:none">Open job folder</button>
  <div id="log"></div>
</div>

<script>
const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: { carto: { type: "raster", tiles: [
      "https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png"], tileSize: 256,
      attribution: "&copy; OpenStreetMap contributors &copy; CARTO" } },
    layers: [{ id: "carto", type: "raster", source: "carto" }]
  },
  center: [-111.9, 39.4], zoom: 6
});
map.addControl(new maplibregl.NavigationControl());
map.boxZoom.disable();   // shift-drag belongs to us

let bbox = null, boxEl = null, start = null;
const cnv = map.getCanvasContainer();

map.on("mousedown", e => {
  if (!e.originalEvent.shiftKey) return;
  e.preventDefault();
  start = e.point;
  boxEl = document.createElement("div");
  boxEl.style.cssText = "position:absolute;border:2px solid #b03a2e;background:rgba(176,58,46,.08);pointer-events:none";
  cnv.appendChild(boxEl);
  const move = ev => {
    const p = ev.point;
    boxEl.style.left = Math.min(start.x, p.x) + "px";
    boxEl.style.top = Math.min(start.y, p.y) + "px";
    boxEl.style.width = Math.abs(p.x - start.x) + "px";
    boxEl.style.height = Math.abs(p.y - start.y) + "px";
  };
  const up = ev => {
    map.off("mousemove", move); map.off("mouseup", up);
    const a = map.unproject(start), b = map.unproject(ev.point);
    bbox = [Math.min(a.lng, b.lng), Math.min(a.lat, b.lat),
            Math.max(a.lng, b.lng), Math.max(a.lat, b.lat)];
    showExtent();
  };
  map.on("mousemove", move); map.on("mouseup", up);
});

function showExtent() {
  const [w, s, e, n] = bbox;
  const kmx = 111.32 * Math.cos((s + n) / 2 * Math.PI / 180) * (e - w);
  const kmy = 110.57 * (n - s);
  document.getElementById("extent").innerHTML =
    `${s.toFixed(4)}&deg; &rarr; ${n.toFixed(4)}&deg;N &nbsp; ${w.toFixed(4)}&deg; &rarr; ${e.toFixed(4)}&deg;E` +
    `<br>${kmx.toFixed(1)} &times; ${kmy.toFixed(1)} km &nbsp; <span class="badge">like this extent?</span>`;
  document.getElementById("go").disabled = false;
}

document.getElementById("useview").onclick = () => {
  const b = map.getBounds();
  bbox = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()];
  showExtent();
};

let jobId = null, seen = 0;
document.getElementById("go").onclick = async () => {
  const layers = {};
  document.querySelectorAll("#layers input").forEach(c => layers[c.dataset.k] = c.checked);
  const params = {
    bbox,
    page: document.getElementById("page").value,
    title: document.getElementById("title").value,
    dem: document.getElementById("dem").value,
    contour_interval: +document.getElementById("contour").value,
    texture: document.getElementById("texture").value,
    layers
  };
  const r = await fetch("/api/jobs", { method: "POST", body: JSON.stringify(params),
    headers: { "Content-Type": "application/json" } });
  jobId = (await r.json()).id; seen = 0;
  document.getElementById("go").disabled = true;
  const log = document.getElementById("log");
  log.style.display = "block"; log.textContent = "";
  poll();
};

async function poll() {
  const r = await fetch(`/api/jobs/${jobId}?since=${seen}`);
  const j = await r.json();
  const log = document.getElementById("log");
  j.log.forEach(l => log.textContent += l + "\n");
  seen = j.n; log.scrollTop = log.scrollHeight;
  if (j.status === "running") return setTimeout(poll, 1200);
  document.getElementById("go").disabled = false;
  if (j.dir) document.getElementById("open").style.display = "block";
  log.textContent += j.status === "done"
    ? `\n*** DONE (${j.adobe}) — ${j.dir}\n` : "\n*** FAILED, read the log\n";
}

document.getElementById("open").onclick = () =>
  fetch(`/api/jobs/${jobId}/open`, { method: "POST" });
</script>
</body>
</html>
